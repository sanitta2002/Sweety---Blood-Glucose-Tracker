version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sweety-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sweety_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sweety_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
